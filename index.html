<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite para Jogar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #222;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #333;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
        }

        h1 {
            color: #00ff88;
        }

        p {
            font-size: 18px;
        }

        button {
            background: #00ff88;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #00cc6a;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🎮 Bora Jogar?</h1>

        <p>Fala my friends?</p>
        <p>🎮</p>
    </div>

</body>
</html>
